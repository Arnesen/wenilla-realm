name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse any game data in the build context
        run: |
          if find . -path ./.git -prune -o \( -iname '*.mpq' -o -iname '*.dbc' \) -print | grep .; then
            echo "game data files found in the repository; refusing to build" >&2; exit 1
          fi
  mangos:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: load upstream pins
        run: grep -E "^[A-Z_]+=" upstreams.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wenilla-realm-mangos
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mangos.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANGOS_CLASSIC_COMMIT=${{ env.MANGOS_CLASSIC_COMMIT }}
            CLASSIC_DB_COMMIT=${{ env.CLASSIC_DB_COMMIT }}
          cache-from: type=gha,scope=mangos
          cache-to: type=gha,scope=mangos,mode=max
  realm:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: load upstream pins
        run: grep -E "^[A-Z_]+=" upstreams.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wenilla-realm
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/realm.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WENILLA_REPO=${{ env.WENILLA_REPO }}
            WENILLA_COMMIT=${{ env.WENILLA_COMMIT }}
          cache-from: type=gha,scope=realm
          cache-to: type=gha,scope=realm,mode=max
